name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: sudo npm install -g @google/clasp

      - name: Setup clasp credentials
        env:
          CLASPRC_B64: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          mkdir -p ~/.clasp
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const clasprc = Buffer.from(process.env.CLASPRC_B64, 'base64').toString('utf-8');
            fs.writeFileSync(path.join(os.homedir(), '.clasprc.json'), clasprc, { mode: 0o600 });
            fs.writeFileSync('.clasp.json', JSON.stringify({ scriptId: process.env.SCRIPT_ID, rootDir: '.' }));
          "

      - name: Push to Google Apps Script
        run: |
          clasp status
          clasp push --force
